# Example.
#
# Add the card resource once (Settings -> Dashboards -> Resources):
#   url: /local/temperature-card/loader.js
#   type: module
# (loader.js imports temperature-card.js with a fresh ?ts= on every page
# load; do not register temperature-card.js itself as a resource.)
#
# Each sensor needs a temp_entity; humidity_entity and name are optional.
# Replace the entities with sensors from your own Home Assistant.

type: custom:temperature-card
sensors:
  - name: Garage Fridge
    temp_entity: sensor.garage_fridge_temperature

  - name: Hallway
    temp_entity: sensor.home_current_temperature
    humidity_entity: sensor.home_current_humidity

  - name: Upstairs
    temp_entity: sensor.den_temperature

  - name: Den
    temp_entity: sensor.upstairs_temperature

  - name: Patio
    temp_entity: sensor.garage_freezer_temperature

  - name: Kitchen Fridge
    temp_entity: sensor.kitchen_fridge_temperature

  - name: Kitchen Freezer
    temp_entity: sensor.kitchen_freezer_temperature

  - name: Shed
    temp_entity: sensor.shed_temperature


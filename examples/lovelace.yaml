# Temperature Card: example dashboard card configuration.
#
# Install the card first (see README.md): copy loader.js and
# temperature-card.js into /config/www/temperature-card/ and add one
# dashboard resource:
#   url: /local/temperature-card/loader.js
#   type: module
# (register loader.js only, not temperature-card.js).
#
# Replace the entity IDs below with sensors from your own Home Assistant.
# Each sensor needs a temp_entity; name, humidity_entity, battery_entity and
# id are optional (id is only needed to use the sensor in groups).

type: custom:temperature-card

# All optional; the values shown here are the defaults except the battery
# position (default upper-right).
temperature_precision: 1        # decimals for temperatures, 0-3
humidity_precision: 0           # decimals for humidity, 0-3
battery_position: lower-right   # upper-left, upper-right, lower-left or lower-right
battery_orientation: vertical   # vertical or horizontal

sensors:
  - id: kitchen
    name: Kitchen
    temp_entity: sensor.kitchen_temperature
    battery_entity: sensor.kitchen_sensor_battery

  - id: hallway
    name: Hallway
    temp_entity: sensor.hallway_temperature
    humidity_entity: sensor.hallway_humidity

  - id: upstairs
    name: Upstairs
    temp_entity: sensor.upstairs_temperature
    battery_entity: sensor.upstairs_sensor_battery

  - id: patio
    name: Patio
    temp_entity: sensor.patio_temperature
    battery_entity: sensor.patio_sensor_battery

  - id: garage
    name: Garage
    temp_entity: sensor.garage_temperature
    battery_entity: sensor.garage_sensor_battery

  - id: kitchen_fridge
    name: Kitchen Fridge
    temp_entity: sensor.kitchen_fridge_temperature
    humidity_entity: sensor.kitchen_fridge_humidity
    battery_entity: sensor.kitchen_fridge_battery

# Optional: tabs, shown in this order. Items are sensor ids (normal tiles) or
# roll-ups that average several sensors; open_group makes a roll-up switch to
# another tab when clicked or tapped. Without groups, every sensor above is
# shown in one grid.
groups:
  - id: overview
    name: Overview
    items:
      - name: Inside
        average: [kitchen, hallway, upstairs]
        open_group: inside
      - name: Outside
        average: [patio, garage]
        open_group: outside

  - id: inside
    name: Inside
    items:
      - kitchen
      - hallway
      - upstairs

  - id: outside
    name: Outside
    items:
      - patio
      - garage

  - id: kitchen_fridge
    name: Kitchen Fridge
    items:
      - kitchen_fridge

# Without groups (all sensors in one grid):
#
# type: custom:temperature-card
# sensors:
#   - name: Kitchen Fridge
#     temp_entity: sensor.kitchen_fridge_temperature
#     humidity_entity: sensor.kitchen_fridge_humidity
#     battery_entity: sensor.kitchen_fridge_battery
#   - name: Patio
#     temp_entity: sensor.patio_temperature

# One sensor (shorthand):
#
# type: custom:temperature-card
# entity: sensor.patio_temperature
